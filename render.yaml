services:
  # Вариант 1: Один сервис с комбинированным Dockerfile (рекомендуется)
  - type: web
    name: bothubchat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    healthCheckPath: /
    # Автоматический деплой при пуше в main ветку
    autoDeploy: true
    branch: main

